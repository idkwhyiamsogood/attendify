[workspace]
resolver = "3"
members = ["crates/*", "services/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
common = { path = "crates/common" }
db = { path = "crates/db" }
auth-kit = { path = "crates/auth-kit" }
messaging = { path = "crates/messaging" }

axum = "0.8.9"
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
figment = { version = "0.10", features = ["env", "toml"] }

sea_orm = { package = "sea-orm", version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-time"] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde"] }
async_trait = { version="stable" }